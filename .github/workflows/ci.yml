name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: Run tests with coverage gate
        run: |
          pytest --cov=src --cov=app --cov-fail-under=40 -q

      - name: Run Bandit SAST
        run: |
          bandit -r src/ app.py

      - name: Run Pip Audit
        run: |
          pip-audit -r requirements.txt
